[package]
name = "gift_draw_registry"
version = "0.1.0"
description = "GiftDraw on-chain kind roll and draw commit registry"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "gift_draw_registry"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
idl-build = ["anchor-lang/idl-build"]
default = []

[dependencies]
anchor-lang = "0.30.1"
